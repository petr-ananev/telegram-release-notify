name: Deploy to Server

on:
  push:
    branches: [ feat/bot ]

jobs:
  deploy:
    environment: env
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug
        run: |
          echo "Key exists: ${{ secrets.SERVER_SSH_KEY != '' }}"
          echo "Key length: $(echo '${{ secrets.SERVER_SSH_KEY }}' | wc -c)"
          echo "First 50 chars: $(echo '${{ secrets.SERVER_SSH_KEY }}' | head -c 50)"

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port : 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "bot.py,release_notifier.py,release_notifier.py,requirements.txt,workflow_matrix.json"
          target: "/opt/telegram-release-notify"
          strip_components: 1
